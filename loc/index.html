<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biserici</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #fdf7ee; --ink: #2b1d17; --muted: #6b5a51; --brand: #7a2c1e; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1512; --ink: #f4ece6; --muted: #bfaea4; --brand: #e3a72f; --card: #2a201b; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .kicker { color: var(--brand); font-weight: 600; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  h1 { font-size: 26px; line-height: 1.25; margin: 6px 0 16px; }
  a.button { display: block; text-align: center; padding: 14px; border-radius: 14px; text-decoration: none; font-weight: 600; margin-top: 12px; }
  .primary { background: var(--brand); color: #fff; }
  .secondary { border: 1px solid var(--muted); color: var(--ink); }
  p.note { color: var(--muted); font-size: 15px; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="kicker">Biserici</div>
    <h1 id="name">O biserică din aplicația Biserici</h1>
    <a id="open" class="button primary" href="https://play.google.com/store/apps/details?id=ro.infoortodox.app&amp;referrer=utm_source%3Dshare_link">Deschide în aplicație</a>
    <a id="map" class="button secondary" href="https://www.openstreetmap.org/" hidden>Vezi pe hartă</a>
    <a class="button secondary" href="https://play.google.com/store/apps/details?id=ro.infoortodox.app&amp;referrer=utm_source%3Dshare_link">Instalează Biserici din Google Play</a>
    <p class="note">Bisericile și mănăstirile ortodoxe din jurul tău, calendarul și pelerinajele. Fără cont, fără date trimise de pe telefon.</p>
  </div>
</main>
<script>
  // The link a share carries: ?id=<place id>&n=<name>&lat=..&lon=..
  // On Android, "Deschide în aplicație" opens the place in Biserici, or Google Play without it.
  (function () {
    var q = new URLSearchParams(location.search);
    var id = q.get("id") || "";
    var name = q.get("n");
    var lat = parseFloat(q.get("lat")), lon = parseFloat(q.get("lon"));
    if (name) { document.getElementById("name").textContent = name; document.title = name + " · Biserici"; }
    if (isFinite(lat) && isFinite(lon)) {
      var map = document.getElementById("map");
      map.href = "https://www.openstreetmap.org/?mlat=" + lat + "&mlon=" + lon + "#map=17/" + lat + "/" + lon;
      map.hidden = false;
    }
    if (/^[A-Za-z0-9:_.-]{1,100}$/.test(id) && /Android/i.test(navigator.userAgent)) {
      var play = "https://play.google.com/store/apps/details?id=ro.infoortodox.app&referrer=utm_source%3Dshare_link";
      document.getElementById("open").href = "intent://loc/" + encodeURIComponent(id) +
        "#Intent;scheme=biserici;package=ro.infoortodox.app;S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
    }
  })();
</script>
</body>
</html>
